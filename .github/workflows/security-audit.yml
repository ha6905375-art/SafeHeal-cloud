name: Security audit (advisory review)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit tool
        run: python -m pip install pip-audit
      - name: Audit runtime dependencies (including resolved transitive packages)
        run: python -m pip_audit -r backend/requirements.txt --progress-spinner off
  docker-image:
    name: Built Docker image vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the ACTUAL website container (never an AI-generated patch)
        run: docker build -f Dockerfile.web -t safeheal-cloud:security-check .
      - name: Trivy image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'safeheal-cloud:security-check'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          vuln-type: 'os,library'
  git-history:
    name: Git history secret leak scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for possible credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
