name: CI — Python tests

on:
  push:
    branches:
      - main
      - integration/frontend-ready
      - feature/webapp-integration
      - feature/render-deployment
  pull_request:
    branches:
      - main
      - integration/frontend-ready
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Fresh install and tests (Python 3.11, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AI_MODE: mock
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install pinned direct dependencies in clean Python environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check resolved dependency compatibility
        run: python -m pip check

      - name: Run offline test suite without Nebius credentials
        run: python -m pytest -q
