# SafeHeal Cloud: one free FastAPI service serves both the site and backend.
# Deployment is password-protected so visitors cannot freely spend Nebius credits.
services:
  - type: web
    name: safeheal-cloud
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn webapp.public:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AI_MODE
        value: mock
      - key: SAFEHEAL_DEMO_PASSWORD
        sync: false
      - key: NEBIUS_MODEL
        value: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
